# One-click online hosting on Render (render.com): New → Blueprint → pick this repository.
# Runs the workspace in workspace-lite/ with a 1 GB persistent disk for the database and files.
services:
  - type: web
    name: integral-workspace
    runtime: docker
    rootDir: workspace-lite
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter # a persistent disk needs a paid plan; the free plan would wipe your data
    healthCheckPath: /health
    disk:
      name: workspace-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: SETUP_CODE # needed to create the first admin account; find it under Environment in the Render dashboard
        generateValue: true
