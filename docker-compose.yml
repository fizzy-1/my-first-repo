# Local PostgreSQL for development: `docker compose up -d`
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: integral
      POSTGRES_PASSWORD: integral
      POSTGRES_DB: integral_workspace
    ports:
      - "5432:5432"
    volumes:
      - integral_pg:/var/lib/postgresql/data

volumes:
  integral_pg:
